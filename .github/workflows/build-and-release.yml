  release:
    name: Publish GitHub Release
    needs: [build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: RhothorStudio-v1.0.0-windows-x64

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            RhothorStudio-v1.0.0-windows-x64.zip
          name: Release ${{ github.ref_name || 'v1.0.0' }}
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## ⚡ Rhothor Laser Studio v1.0.0
            
            Phần mềm máy tính điều khiển và chẩn đoán đầu quét chùm tia laser **Newson Rhothor™ RT-CU** (hệ máy LPKF).
            **Publisher:** chaunt <chaunt.dev@gmail.com>

            ### 📦 Bản phát hành tải về (Windows):
            * **`RhothorStudio-v1.0.0-windows-x64.zip`**: Bản thực thi độc lập cho Windows 10 & 11 (64-bit).
              - Không cần cài Python hay bất kỳ thư viện ngoài nào.
              - Đã giải quyết triệt để lỗi tương thích thư viện DLL `rtSetMaxSpeed` với firmware v7.5.
              - Tích hợp sẵn `rhothor.dll` chuẩn x64 và x86 trong thư mục ứng dụng.
              - Chỉ cần giải nén và nhấp đúp file **`RhothorStudio.exe`** để chạy ngay.

            ### 🚀 Tính năng chính trong bản phát hành này:
            1. **2D Vector Marking**: Hỗ trợ nạp file CAD `.dxf` (EzCad/AutoCAD) & `.plt` (CorelDraw), tạo hình chuẩn, đan lưới hatch, tính quãng đường và thời gian quét.
            2. **3D Dynamic Focus**: Điều khiển thấu kính Z ELEVAthor EL-S2, khắc bề mặt bậc thang đa tầng và dốc nghiêng 3D liên tục.
            3. **Hiệu chuẩn độ trễ**: Tự động tạo ma trận 5 mức trễ (20..100 µs) để soi kính hiển vi tối ưu hóa `Gate On/Off Delays`.
            4. **Q-Switch & Digital I/O**: Kích xung laser MOPA/Q-switch qua Oscillator phần cứng, khoan điểm tĩnh, điều khiển khí nén, quạt hút, đèn laser đỏ định vị và giám sát cảm biến an toàn Interlock.
            5. **Chẩn đoán phần cứng**: Tự động nhận diện thiết bị USB và bộ mô phỏng kinematic khi không có máy thật.
