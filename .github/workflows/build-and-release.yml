  release:
    name: Publish GitHub Release
    needs: [build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: RhothorStudio-windows-x64

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            RhothorStudio-*.zip
          name: Release ${{ github.ref_name || 'v1.1.0' }}
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## ⚡ Rhothor Laser Studio ${{ github.ref_name || 'v1.1.0' }}
            
            Phần mềm máy tính điều khiển và chẩn đoán đầu quét chùm tia laser **Newson Rhothor™ RT-CU** (hệ máy LPKF).
            **Publisher:** chaunt <chaunt.dev@gmail.com>

            ### 📦 Bản phát hành tải về (Windows):
            * **`RhothorStudio-${{ github.ref_name || 'v1.1.0' }}-windows-x64.zip`**: Bản thực thi độc lập cho Windows 10 & 11 (64-bit).
              - Không cần cài Python hay bất kỳ thư viện ngoài nào.
              - Đã giải quyết triệt để lỗi DSP buffer `rtListOpen` [13] và tự động ép trần tốc độ `rtSetJumpSpeed` theo `MaxSpeed` (2000 mm/s).
              - Mặc định tuyệt đối thư viện driver chuẩn `v7.3/v7.5 LPKF Legacy Native` (`rhothor.dll`).
              - Chỉ cần giải nén và nhấp đúp file **`RhothorStudio.exe`** để chạy ngay.

            ### 🚀 Tính năng mới trong bản phát hành v1.1.0:
            1. **Trình Đọc Bản Vẽ CNC & Preview Toàn Năng (CAD/CAM Importer)**:
               - **File Vector CAD**: Hỗ trợ trực tiếp `.DXF` (AutoCAD/EZCAD), `.SVG` (W3C standard), `.AI` (Adobe Illustrator), `.PLT` / `.HPGL` (CorelDRAW).
               - **File Dự Án Laser**: Đọc trực tiếp `.LBRN` & `.LBRN2` (LightBurn 1.x & 2.x), `.EZD` & `.EZ3` (EZCAD2 & EZCAD3).
               - **Khắc Ảnh Chân Dung / Bitmap (Raster Photo Engrave & Shading)**: Hỗ trợ ảnh `.PNG`, `.JPG`, `.BMP` với 3 thuật toán: Quét dòng ngang (Hatch), Tán sắc nghệ thuật (Floyd-Steinberg Dither) và Dò viền (Contour Edge).
            2. **Bộ Công Cụ Căn Chỉnh Hình Học (Auto-Fit & Alignment)**:
               - Tự động co giãn vừa khổ quét galvo (Auto-Fit), đưa bản vẽ về tâm (0, 0), xoay 90°/180°/270°, lật đối xứng gương X/Y.
            3. **Quét Khung Phôi An Toàn (Red Frame Guide)**:
               - Quét đường bao giới hạn phôi (Laser OFF) trước khi khắc giúp canh chỉnh phôi chính xác 100%.
            4. **Hiển Thị Bảng Layer & Thông Số**:
               - Phân tích chi tiết số nét, kích thước thực tế mm, quãng đường quét laser và thời gian ước tính.
            5. **Tự Động Giới Hạn Tốc Độ (Hardware Speed Clamping)**:
               - Tự động đọc giới hạn động học từ phần cứng (`MaxSpeed = 2000 mm/s`), không bao giờ để tốc độ vượt quá giới hạn gây lỗi `[13]`.
