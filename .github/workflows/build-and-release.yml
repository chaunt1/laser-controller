  release:
    name: Publish GitHub Release
    needs: [build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: RhothorStudio-windows-x64

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            RhothorStudio-*-windows-x64.zip
          name: Release ${{ github.ref_name || 'v1.2.3' }}
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## ⚡ Rhothor Laser Studio ${{ github.ref_name || 'v1.2.3' }}
            
            Phần mềm máy tính điều khiển và chẩn đoán đầu quét chùm tia laser **Newson Rhothor™ RT-CU** (hỗ trợ mọi model galvo Newson Rhothor).
            **Publisher:** chaunt <chaunt.dev@gmail.com>

            ### 📦 Bản phát hành tải về (Windows):
            * **`RhothorStudio-${{ github.ref_name || 'v1.2.3' }}-windows-x64.zip`**: Bản thực thi độc lập cho Windows 10 & 11 (64-bit).
              - Không cần cài Python hay bất kỳ thư viện ngoài nào.
              - Mặc định tuyệt đối thư viện driver chuẩn `v7.3/v7.5 LPKF Legacy Native` (`rhothor.dll`).
              - Đã giải quyết triệt để lỗi DSP buffer `rtListOpen` [13] và tự động ép trần an toàn tốc độ `rtSetJumpSpeed` theo `MaxSpeed`.
              - Chỉ cần giải nén và nhấp đúp file **`RhothorStudio.exe`** để chạy ngay.

            ### 🚀 Tính năng mới trong bản phát hành v1.2.3:
            1. **Tự Động Nhận Diện Thiết Bị Linh Hoạt (Flexible Hardware Auto-Discovery)**:
               - Giải quyết triệt để lỗi `[5] Hardware not responding` khi cắm thiết bị khác có Serial Number khác (ví dụ: SN 5604 thay vì 4281).
               - Tích hợp hàm API Newson `rtGetFreeDevList` quét toàn bộ thiết bị Rhothor đang cắm qua cổng USB.
               - Hỗ trợ chế độ kết nối tự động khi chỉ có 1 thiết bị gắn máy tính (bỏ qua `rtSelectDevice` theo mục 5.5 Rhothor User Manual).
               - Cơ chế **Auto-Fallback**: Nếu người dùng nhấn kết nối với Serial cũ không khớp, phần mềm tự bắt lỗi, tự động quét USB, kết nối ngay với thiết bị mới đang cắm và tự động cập nhật lại số Serial + thông số kinematics lên giao diện.
            2. **Bổ Sung Nút "🔍 DÒ TÌM (SCAN)" Trên Tab Kết Nối**:
               - Nhấn nút để dò tìm tức thì các bo mạch Rhothor kết nối qua USB.
               - Ô Serial Number cho phép để trống (Auto-Detect) để phần mềm tự chọn.
            3. **Đồng Bộ Phát Tia Hoàn Chỉnh Theo Sơ Đồ Ghép Nối Nguồn Fiber Laser (từ v1.2.2)**:
               - **IO6 (Chân 6/19)** $\rightarrow$ MAX485 #1 $\rightarrow$ **Pin 19 (Emission Gate)**.
               - **IO7 (Chân 7/20)** $\rightarrow$ MAX485 #2 $\rightarrow$ **Pin 20 (Sync / PRR)**.
               - **IO5 (Chân 5/18)** $\rightarrow$ MAX485 #3 $\rightarrow$ **Pin 9 (Latch Clock)**.
               - Nút **Test Emission 1s** và chỉnh tần số xung PRR 10..150 kHz trên Tab Khắc 2D.
               - Chế độ Test tự động tuần tự 7 cặp chân (Auto Step Tester 1/14 -> 7/20), bộ đọc bản vẽ CAD toàn năng (.DXF, .SVG, .AI, .PLT, .LBRN, .EZD) và khắc ảnh chân dung Shading.
