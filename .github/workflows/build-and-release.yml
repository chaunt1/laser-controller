  release:
    name: Publish GitHub Release
    needs: [build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: RhothorStudio-windows-x64

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            RhothorStudio-*-windows-x64.zip
          name: Release ${{ github.ref_name || 'v1.2.0' }}
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## ⚡ Rhothor Laser Studio ${{ github.ref_name || 'v1.2.0' }}
            
            Phần mềm máy tính điều khiển và chẩn đoán đầu quét chùm tia laser **Newson Rhothor™ RT-CU** (hệ máy LPKF).
            **Publisher:** chaunt <chaunt.dev@gmail.com>

            ### 📦 Bản phát hành tải về (Windows):
            * **`RhothorStudio-${{ github.ref_name || 'v1.2.0' }}-windows-x64.zip`**: Bản thực thi độc lập cho Windows 10 & 11 (64-bit).
              - Không cần cài Python hay bất kỳ thư viện ngoài nào.
              - Đã giải quyết triệt để lỗi DSP buffer `rtListOpen` [13] và tự động ép trần an toàn tốc độ `rtSetJumpSpeed` theo `MaxSpeed` (2000 mm/s).
              - Mặc định tuyệt đối thư viện driver chuẩn `v7.3/v7.5 LPKF Legacy Native` (`rhothor.dll`).
              - Chỉ cần giải nén và nhấp đúp file **`RhothorStudio.exe`** để chạy ngay.

            ### 🚀 Tính năng mới trong bản phát hành v1.2.0:
            1. **Ghép Nối Nguồn Fiber Laser Công Nghiệp Trực Tiếp (Direct DB-25 Fiber Adapter)**:
               - Hỗ trợ kết nối đồng bộ trực tiếp với các dòng nguồn Fiber phổ biến (Raycus, JPT, Max Photonics, IPG) không cần card EzCad trung gian.
               - Tích hợp chuẩn giao tiếp vi sai RS-485 sang TTL logic 5V cho các tín hiệu xung then chốt: **Emission Gate** (Pin 19), **Sync/PRR** (Pin 20), và **Latch Pulse** (Pin 9).
            2. **Hỗ Trợ Xung Chốt Dữ Liệu Công Suất (Pin 9 Latch Pulse Triggering)**:
               - Tự động phát xung Latch chốt giá trị thanh ghi công suất 8-bit ($D_0 \dots D_7$) vào bộ đệm của nguồn Fiber Laser trước mỗi chu trình khắc.
               - Bổ sung nút bấm phát xung Latch thủ công trên Tab I/O phục vụ kiểm tra chẩn đoán thực nghiệm.
            3. **Trình Tra Cứu & Hiển Thị Sơ Đồ Đấu Nối Trực Quan (Interactive Wiring Visualizer)**:
               - Cửa sổ trực quan tích hợp ngay trong ứng dụng với bảng gán chân chi tiết, sơ đồ nguyên lý mạch chuyển đổi RS-485 (MAX485/SN75176) và lưu ý chống chập cháy điện áp 12V.
            4. **Mở Rộng Thư Viện Lệnh Digital I/O SDK**:
               - Cung cấp đầy đủ các hàm điều khiển I/O phần cứng thời gian thực: `set_io()`, `get_io()`, `wait_io()`, `send_latch_pulse()` hỗ trợ tự động hóa dây chuyền CNC.
            5. **Kế Thừa Đầy Đủ Bộ Đọc Bản Vẽ Toàn Năng (v1.1.1)**:
               - Hỗ trợ toàn diện CAD Vector (`.DXF`, `.SVG`, `.AI`, `.PLT`), Dự án Laser (`.LBRN`/`.LBRN2`, `.EZD`/`.EZ3`) & Khắc ảnh Shading (`.PNG`, `.JPG`, `.BMP`).
