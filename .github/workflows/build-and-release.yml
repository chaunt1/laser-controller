name: Build and Create Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows App (.exe)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build executable with PyInstaller
        run: |
          pyinstaller --clean RhothorStudio.spec

      - name: Verify build output
        shell: pwsh
        run: |
          if (-not (Test-Path "dist\RhothorStudio.exe")) {
            throw "dist\RhothorStudio.exe not found!"
          }
          Write-Host "Build succeeded: dist\RhothorStudio.exe"

      - name: Package Windows Release Archive
        shell: pwsh
        run: |
          $Tag = if ($env:GITHUB_REF_NAME) { $env:GITHUB_REF_NAME } else { "v1.2.1" }
          $ReleaseFolder = "RhothorStudio-$Tag-windows-x64"
          New-Item -ItemType Directory -Force -Path $ReleaseFolder
          Copy-Item -Path "dist\RhothorStudio.exe" -Destination $ReleaseFolder
          Copy-Item -Path "sdk\lib\x64\rhothor.dll" -Destination "$ReleaseFolder\rhothor.dll" -Force
          Copy-Item -Recurse -Force -Path "sdk" -Destination $ReleaseFolder
          Copy-Item -Path "README.md" -Destination $ReleaseFolder
          Copy-Item -Path "run_studio.bat" -Destination $ReleaseFolder
          Copy-Item -Recurse -Force -Path "docs" -Destination "$ReleaseFolder\docs"
          Copy-Item -Recurse -Force -Path "examples" -Destination "$ReleaseFolder\examples"
          Copy-Item -Recurse -Force -Path "tools" -Destination "$ReleaseFolder\tools"
          Compress-Archive -Path $ReleaseFolder -DestinationPath "RhothorStudio-$Tag-windows-x64.zip" -Force

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RhothorStudio-windows-x64
          path: RhothorStudio-*-windows-x64.zip

