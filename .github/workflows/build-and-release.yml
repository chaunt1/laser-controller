name: Build and Create Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows App (.exe)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PyQt5 pyinstaller

      - name: Build executable with PyInstaller
        run: |
          pyinstaller --clean RhothorStudio.spec

      - name: Verify build output
        shell: pwsh
        run: |
          if (-not (Test-Path "dist\RhothorStudio.exe")) {
            throw "dist\RhothorStudio.exe not found!"
          }
          Write-Host "Build succeeded: dist\RhothorStudio.exe"

      - name: Package Windows Release Archive
        shell: pwsh
        run: |
          $ReleaseFolder = "RhothorStudio-v1.0.0-windows-x64"
          New-Item -ItemType Directory -Force -Path $ReleaseFolder
          Copy-Item -Path "dist\RhothorStudio.exe" -Destination $ReleaseFolder
          Copy-Item -Path "README.md" -Destination $ReleaseFolder
          Copy-Item -Path "run_studio.bat" -Destination $ReleaseFolder
          Copy-Item -Recurse -Force -Path "docs" -Destination "$ReleaseFolder\docs"
          Copy-Item -Recurse -Force -Path "examples" -Destination "$ReleaseFolder\examples"
          Compress-Archive -Path $ReleaseFolder -DestinationPath "RhothorStudio-v1.0.0-windows-x64.zip" -Force

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RhothorStudio-v1.0.0-windows-x64
          path: RhothorStudio-v1.0.0-windows-x64.zip

  build-linux:
    name: Build Linux App
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-glx libegl1-mesa libxkbcommon-x11-0 libfontconfig1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PyQt5 pyinstaller

      - name: Build executable with PyInstaller
        run: |
          pyinstaller --clean RhothorStudio.spec

      - name: Package Linux Release Archive
        run: |
          RELEASE_DIR="RhothorStudio-v1.0.0-linux-x86_64"
          mkdir -p "$RELEASE_DIR"
          cp dist/RhothorStudio "$RELEASE_DIR/"
          cp README.md run_studio.sh "$RELEASE_DIR/"
          cp -r docs examples "$RELEASE_DIR/"
          tar -czvf "RhothorStudio-v1.0.0-linux-x86_64.tar.gz" "$RELEASE_DIR"

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RhothorStudio-v1.0.0-linux-x86_64
          path: RhothorStudio-v1.0.0-linux-x86_64.tar.gz

  release:
    name: Publish GitHub Release
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: RhothorStudio-v1.0.0-windows-x64

      - name: Download Linux Artifact
        uses: actions/download-artifact@v4
        with:
          name: RhothorStudio-v1.0.0-linux-x86_64

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            RhothorStudio-v1.0.0-windows-x64.zip
            RhothorStudio-v1.0.0-linux-x86_64.tar.gz
          name: Release ${{ github.ref_name || 'v1.0.0' }}
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## ⚡ Rhothor Laser Studio v1.0.0
            
            Phần mềm máy tính điều khiển và chẩn đoán đầu quét chùm tia laser **Newson Rhothor™ RT-CU** (hệ máy LPKF).

            ### 📦 Các bản phát hành tải về (Downloads):
            * **`RhothorStudio-v1.0.0-windows-x64.zip`**: Bản thực thi độc lập cho Windows 10 & 11 (64-bit). Chỉ cần giải nén và nhấp đúp file `RhothorStudio.exe` để chạy ngay, không cần cài Python hay thư viện.
            * **`RhothorStudio-v1.0.0-linux-x86_64.tar.gz`**: Bản thực thi độc lập cho Linux x86_64.

            ### 🚀 Tính năng chính trong bản phát hành này:
            1. **2D Vector Marking**: Hỗ trợ nạp file CAD `.dxf` (EzCad/AutoCAD) & `.plt` (CorelDraw), tạo hình chuẩn, đan lưới hatch, tính quãng đường và thời gian quét.
            2. **3D Dynamic Focus**: Điều khiển thấu kính Z ELEVAthor EL-S2, khắc bề mặt bậc thang đa tầng và dốc nghiêng 3D liên tục.
            3. **Hiệu chuẩn độ trễ**: Tự động tạo ma trận 5 mức trễ (20..100 µs) để soi kính hiển vi tối ưu hóa `Gate On/Off Delays`.
            4. **Q-Switch & Digital I/O**: Kích xung laser MOPA/Q-switch qua Oscillator phần cứng, khoan điểm tĩnh, điều khiển khí nén, quạt hút, đèn laser đỏ định vị và giám sát cảm biến an toàn Interlock.
            5. **Chẩn đoán phần cứng**: Tự động nhận diện thiết bị USB và bộ mô phỏng kinematic khi không có máy thật.
